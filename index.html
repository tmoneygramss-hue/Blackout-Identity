<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OPS: YOU — Battle Royale</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; background: #111; }
    #ui {
      position: absolute; top: 15px; left: 15px; z-index: 10;
      background: rgba(0, 0, 0, 0.8); color: white; padding: 15px;
      border-radius: 8px; border-left: 4px solid #ff9900; max-width: 280px;
    }
    label { display: block; font-size: 0.8rem; color: #ffaa00; margin-top: 8px; font-weight: bold; }
    input[type="text"], select, input[type="file"] {
      width: 100%; margin-top: 4px; padding: 6px; border-radius: 4px;
      border: 1px solid #444; background: #222; color: white; box-sizing: border-box;
    }
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 14px; height: 14px;
      border: 2px solid #00ff66; border-radius: 50%; transform: translate(-50%, -50%);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="ui">
    <strong style="letter-spacing: 1px;">OPERATOR LOADOUT</strong>

    <label for="playerName">OPERATOR NAME:</label>
    <input type="text" id="playerName" placeholder="Enter your name..." value="GHOST-01" maxlength="18" />

    <label for="playerClass">TACTICAL CLASS:</label>
    <select id="playerClass">
      <option value="Rusher">Rusher (+35% Move Speed)</option>
      <option value="Sniper">Sniper (2x Bullet Velocity)</option>
      <option value="Airborne">Airborne (High Jump Boost)</option>
    </select>

    <label for="faceUpload">UPLOAD FACE PHOTO:</label>
    <input type="file" id="faceUpload" accept="image/*" />

    <p style="font-size: 0.85rem; margin: 10px 0 4px;">
      Move: <b>W A S D</b> | Jump: <b>Space</b> | Shoot: <b>Click</b>
    </p>
    <p id="stats" style="font-size: 0.85rem; color: #00ff66; margin: 0;"></p>
  </div>
  <div id="crosshair"></div>

  <script src="https://cloudflare.com"></script>
  <script src="game.js"></script>
</body>
</html>
